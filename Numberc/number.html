<!DOCTYPE html>
<html>
<head>
    <title>Number Conversion App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }
        .box {
            width: 350px;
            margin: 50px auto;
            padding: 20px;
            background: rgb(255, 255, 255);
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
        h2 {
            text-align: center;
        }
        select, input, button {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
        }
        .result {
            margin-top: 15px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Number Conversion App</h2>

    <select id="choice">
        <option value="">Select Conversion</option>
        <option value="d2b">Decimal to Binary</option>
        <option value="d2o">Decimal to Octal</option>
        <option value="d2h">Decimal to Hexadecimal</option>
        <option value="b2d">Binary to Decimal</option>
        <option value="b2o">Binary to Octal</option>
        <option value="b2h">Binary to Hexadecimal</option>
        <option value="o2d">Octal to Decimal</option>
        <option value="o2b">Octal to Binary</option>
        <option value="o2h">Octal to Hexadecimal</option>
        <option value="h2d">Hexadecimal to Decimal</option>
        <option value="h2b">Hexadecimal to Binary</option>
        <option value="h2o">Hexadecimal to Octal</option>
    </select>

    <input type="text" id="num" placeholder="Enter number">
    <button onclick="convert()">Convert</button>

    <div class="result" id="output"></div>
</div>

<script>
function convert() {
    let choice = document.getElementById("choice").value;
    let num = document.getElementById("num").value;
    let result = "";

    if (choice === "d2b") result = parseInt(num).toString(2);
    else if (choice === "d2o") result = parseInt(num).toString(8);
    else if (choice === "d2h") result = parseInt(num).toString(16).toUpperCase();
    else if (choice === "b2d") result = parseInt(num, 2);
    else if (choice === "b2o") result = parseInt(num, 2).toString(8);
    else if (choice === "b2h") result = parseInt(num, 2).toString(16).toUpperCase();
    else if (choice === "o2d") result = parseInt(num, 8);
    else if (choice === "o2b") result = parseInt(num, 8).toString(2);
    else if (choice === "o2h") result = parseInt(num, 8).toString(16).toUpperCase();
    else if (choice === "h2d") result = parseInt(num, 16);
    else if (choice === "h2b") result = parseInt(num, 16).toString(2);
    else if (choice === "h2o") result = parseInt(num, 16).toString(8);
    else result = "Select a valid option";

    document.getElementById("output").innerHTML = "Result: " + result;
}
</script>

</body>
</html>
