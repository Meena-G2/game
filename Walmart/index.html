<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
     body{
        background-image: url("https://e0.pxfuel.com/wallpapers/202/855/desktop-wallpaper-walmart-logo-cut-out-3d-text-white-background-walmart-3d-logo-walmart-emblem-walmart-embossed-logo-walmart-3d-emblem.jpg");
        background-repeat: no repeat ;
        background-attachment:fixed;
        background-size:cover;
      }
    
  </style>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
  <div class="container">
    <h1 stye="color: blue;text-allign: left;">Walmart Visitor Counter</h1>
    <div class="row">
      <div class="col-6">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRhYbyOlg9Fzhllt1fcazRC5W9yatfOkeVUHA&usqp=CAU.jpg" width="600" height="600">
      
      </div>
      <div class="col-6">
      <div class="mb-4 mt-4">
        <label>Gender</label>
        <select class="form-control" id="gender">
          <option value="0" disabled
          selected>--Select--</option>
          <option value="1">Male</option>
          <option value="2">Female</option>
        </select>
        <span id="errGender" style="color:red"></span>
      </div>
      <div class="mb-4">
        <label>Age Group</label>
        <select class="form-control" id="age">
          <option value="0" disabled
          selected>--Select--</option>
          <option value="1">kid</option>
          <option value="2">Teen</option>
          <option value="3">youngester</option>
          <option value="4">Adult</option>
          <option value="5">Senior citizen</option>
        </select>
        <span id="errAge" style="color:red"></span>
      </div>
        <div class="mb-4">
          <label>Comments</label>
          <br>
          <textarea class="form-control" id="Comment"></textarea>
          <span id="errComment" style="color:red"></span>
      </div>
      <div class="mt-4">
        <button class="btn btn-danger" style="width: 100%;" onclick="validateForm() ">Submit</button>
      </div>
      </div>

      </div>
    </div>
  </div>
  <script>
    function validateForm()//function defination
    {
      var gender =document.getElementById('gender').value 
      var age =document.getElementById('age').value
      if(gender==0)
      {
        document.getElementById('errGender'). 
        innerHTML='please select gender'
        return false
      }
      else
      {
        document.getElementById('errGender').innerHTML=''
      }



      if(age==0)
      {
        document.getElementById('errAge'). 
        innerHTML='please select Age'
        return false
      }
      else
      {
        document.getElementById('errAge').innerHTML=''
      }
      var comment =document.getElementById('Comment').value 
      var regxComment =/^[A-Za-z0-9 ]+$/;
      if(comment)
      {
        var validComment = comment.match(regxComment);
        if(!validComment)
        {
          document.getElementById("errComment"). 
          innerHTML ="only alphanumeric character is allowed";
          return false;
        }
        else
      {
        document.getElementById('errComment').innerHTML=''
      }
      }

    }
  </script>
</body>
</html>
