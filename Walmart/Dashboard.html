<!--Analytical Dashboard-->
<!--2 rows-->
<!--1st row = 4 columns-->
<!--2nd row=2 columns-->

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Dashboard</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<!--this above link for chart representaion-->
</head>
<body>
	<div class="container">
		<h1 style="color: red;text-align: left;">Analytical Dashboard</h1>
	<div class="row">
	   <div class="col-3">
		<div class="card" style="background-color: aquamarine;">
			<div class="card-body">
				<h3 class="card-title" style="color: white;">Visitors For Day</h3>
				<h5 class="card-title" style="color: white;">300</h5>
			</div>	
		</div>
	   </div>
	   <div class="col-3">
		<div class="card" style="background-color: rgb(227, 141, 141);">
			<div class="card-body">
				<h3 class="card-title" style="color: white;">Total Visitors</h3>
				<h5 class="card-title" style="color: white;">300</h5>
			</div>	
		</div>
	   </div>
	   <div class="col-3">
		<div class="card" style="background-color: rgb(187, 127, 255);">
			<div class="card-body">
				<h3 class="card-title" style="color: white;">Male Visitors</h3>
				<h5 class="card-title" style="color: white;">120</h5>
			</div>	
		</div>
	   </div>
	   <div class="col-3">
		<div class="card" style="background-color: rgb(255, 127, 219);">
			<div class="card-body">
				<h3 class="card-title" style="color: white;">Female Visitors</h3>
				<h5 class="card-title" style="color: white;">180</h5>
			</div>	
		</div>
	   </div>
	   
	</div>

	<!--2nd row starts--> 
	<div class="row">
		
		<div class="col-6">
		<!--table starts-->
		<div class="mb-3 mt-3">
		<table class="table">
			<thead>
				<tr>
					<td>Sl.no</td>
					<td>Age Group</td>
					<td>Vistors (Day)</td>
					<td>Overall Visitors</td>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td>1.</td>
					<td>Kids</td>
					<td>100</td>
					<td>200</td>
				</tr>

			</tbody>
		</table>
		</div>
	</div>
		<!--2nd column in 2nd row-->
		<div class="col-6">
			
			<div class="mb-3 mt-3">
				<h6>Tread of visitors over the months</h6>
				<canvas id="myChart"></canvas>
			</div>  
		</div>
	</div>
    </div>
	<script>
		const labels = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun','Jul','Aug','Sep','Oct','Nov','Dec']
		const data = {
		labels: labels,
		datasets: [{
			label: 'No of visitors over the month',
			data: [12, 19, 3, 5, 2, 3,8,98,56,32,11,56],
			backgroundColor: [
			'rgb(255, 99, 132)',
			'rgb(54, 162, 235)',
			'rgb(255, 205, 86)',
			'rgb(238, 129, 106)',
			'rgb(238, 195, 106)',
			'rgb(216, 202, 60)',
			'rgb(177, 214, 30)',
			'rgb(125, 238, 217)',
			'rgb(22, 116, 212)',
			'rgb(174, 132, 240)',
			'rgb(244, 39, 243)',
			'rgb(244, 39, 93)'
			],
			
		}]
		};
		const config = {
			type: 'pie',
			data: data,
			cutout:'0',
			
			};
	  

			const myChart = new Chart(
				document.getElementById('myChart'),
				config
			);
	  </script>
</body>
</html>
