<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Catcher</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <header class="hud">
        <div><span class="label">Score</span><strong id="score">0</strong></div>
        <div><span class="label">Lives</span><strong id="lives">3</strong></div>
        <div><span class="label">Best</span><strong id="best">0</strong></div>
      </header>

      <canvas id="gameCanvas" width="480" height="640" aria-label="Star Catcher game"></canvas>

      <div class="controls">
        <button id="startBtn">Start Game</button>
        <p>Move with ← → or A / D. Catch stars, avoid meteors.</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
